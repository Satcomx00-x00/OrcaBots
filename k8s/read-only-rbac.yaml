# A read-only identity for the cluster bots (Cluster rounds, Drift detector, Right-sizer, Cluster sweeper).
# It can list and read workloads, nodes, volumes and metrics. It cannot change anything, and it cannot
# read Secrets: the built-in `view` role leaves them out.
#
#   kubectl apply -f k8s/read-only-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orca-bots
  namespace: kube-system
---
# What `view` does not cover: cluster-wide objects, metrics, and the deploy tools' own resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orca-bots-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups:
      - argoproj.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - cert-manager.io
      - autoscaling.k8s.io
      - monitoring.coreos.com
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orca-bots-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: orca-bots
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orca-bots-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orca-bots-read
subjects:
  - kind: ServiceAccount
    name: orca-bots
    namespace: kube-system
